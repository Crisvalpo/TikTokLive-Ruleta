<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUKE TIKTOK LIVE MVP — Monitoring Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --card-border: #1f293d;
      --accent: #ff0050;
      --accent-cyan: #00f2fe;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 20px 28px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-badge {
      background: linear-gradient(135deg, var(--accent), #e11d48);
      color: white;
      font-weight: 900;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 14px;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(to right, #fff, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: 99px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-weight: 700;
      font-size: 14px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .main-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
      flex: 1;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
    }

    input {
      background: #0d1322;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 0, 80, 0.2);
    }

    .btn {
      background: linear-gradient(135deg, var(--accent), #00f2fe);
      border: none;
      color: white;
      font-weight: 800;
      font-size: 15px;
      padding: 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-secondary {
      background: #1f293d;
      color: var(--text);
    }

    .obs-btn {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: white;
      text-decoration: none;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-weight: 800;
      display: block;
      margin-top: auto;
    }

    .feed-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      max-height: calc(100vh - 220px);
      padding-right: 6px;
    }

    .event-card {
      background: #0d1322;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .event-card.spin-req {
      border-left: 4px solid var(--accent);
      background: linear-gradient(90deg, rgba(255, 0, 80, 0.08), #0d1322);
    }

    .event-user {
      font-weight: 800;
      color: var(--accent-cyan);
      font-size: 15px;
    }

    .event-comment {
      font-size: 16px;
      margin-top: 4px;
      font-family: 'JetBrains Mono', monospace;
    }

    .event-tag {
      font-size: 11px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tag-spin {
      background: var(--accent);
      color: white;
      box-shadow: 0 0 10px rgba(255, 0, 80, 0.4);
    }

    .tag-comment {
      background: #1f293d;
      color: var(--text-muted);
    }

    .event-time {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-group">
      <span class="brand-badge">LUKE</span>
      <h1>TikTok LIVE MVP — Panel de Monitoreo</h1>
    </div>
    <div class="status-badge" id="statusBadge">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">CONECTANDO...</span>
    </div>
  </header>

  <div class="main-grid">

    <!-- Panel Lateral: Configuración y Simulador -->
    <div class="panel">
      <div class="panel-title">
        <span>Conexión TikTok LIVE</span>
      </div>
      <div class="form-group">
        <label>TikTok Username (@)</label>
        <input type="text" id="tiktokUsernameInput" value="cristian" placeholder="usuario_del_live">
      </div>
      <button class="btn btn-secondary" onclick="updateTikTokUsername()">🔄 Conectar a Usuario</button>

      <hr style="border: 0; border-top: 1px solid var(--card-border); margin: 8px 0;">

      <div class="panel-title">
        <span>Simulador de Eventos</span>
      </div>
      <div class="form-group">
        <label>Usuario simulado</label>
        <input type="text" id="simUser" value="cristian" placeholder="gamer123">
      </div>
      <div class="form-group">
        <label>Comentario</label>
        <input type="text" id="simComment" value="/girar" placeholder="/girar">
      </div>
      <button class="btn" onclick="sendSimulatedEvent()">🚀 Simular /girar (SPIN_REQUEST)</button>

      <a href="/roulette" target="_blank" class="obs-btn">🎰 Ruleta Completa (OBS) ↗</a>
      <a href="/overlay" target="_blank" class="obs-btn" style="background: linear-gradient(135deg, #ff0050, #00f2fe); margin-top: 8px;">📲 Overlay Inferior TikTok LIVE ↗</a>
    </div>

    <!-- Panel Principal: Stream de Eventos -->
    <div class="panel">
      <div class="panel-title">
        <span>Últimos Eventos en Tiempo Real</span>
        <span id="eventCounter" style="font-size: 13px; color: var(--accent-cyan);">0 eventos</span>
      </div>

      <div class="feed-container" id="feedContainer">
        <!-- Eventos insertados dinámicamente aquí -->
      </div>
    </div>

  </div>

  <script>
    let ws;
    let eventCount = 0;

    function connectWebSocket() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}`);

      ws.onopen = () => {
        console.log('Connected to Backend WS');
      };

      ws.onmessage = (msg) => {
        try {
          const payload = JSON.parse(msg.data);
          
          if (payload.type === 'STATUS_UPDATE') {
            updateStatusUI(payload.data);
          } else if (payload.type === 'EVENT' || payload.type === 'SPIN_EXECUTED') {
            addEventToFeed(payload.data || payload.event);
          }
        } catch (e) {
          console.error(e);
        }
      };

      ws.onclose = () => {
        console.log('WS Disconnected. Reconnecting...');
        setTimeout(connectWebSocket, 3000);
      };
    }

    function updateStatusUI(status) {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      const badge = document.getElementById('statusBadge');

      text.innerText = status.statusText || (status.connected ? '🟢 CONNECTED' : '🔴 DISCONNECTED');

      if (status.connected) {
        dot.style.background = '#10b981';
        badge.style.background = 'rgba(16, 185, 129, 0.1)';
        badge.style.borderColor = 'rgba(16, 185, 129, 0.3)';
      } else {
        dot.style.background = '#ef4444';
        badge.style.background = 'rgba(239, 68, 68, 0.1)';
        badge.style.borderColor = 'rgba(239, 68, 68, 0.3)';
      }
    }

    function addEventToFeed(evt) {
      if (!evt) return;
      eventCount++;
      document.getElementById('eventCounter').innerText = `${eventCount} eventos`;

      const feed = document.getElementById('feedContainer');
      const card = document.createElement('div');
      card.className = `event-card ${evt.type === 'SPIN_REQUEST' ? 'spin-req' : ''}`;

      const timeStr = new Date(evt.timestamp).toLocaleTimeString();

      let tagClass = 'tag-comment';
      let tagText = evt.type;

      if (evt.type === 'SPIN_REQUEST') {
        tagClass = 'tag-spin';
      }

      card.innerHTML = `
        <div>
          <div class="event-user">@${evt.username}</div>
          <div class="event-comment">${evt.rawMessage}</div>
          <div class="event-time">${timeStr} ${evt.spinResult ? '➔ 🎯 Result: #' + evt.spinResult.number + ' ' + evt.spinResult.animalEmoji + ' ' + evt.spinResult.animalName : ''}</div>
        </div>
        <div>
          <span class="event-tag ${tagClass}">${tagText}</span>
        </div>
      `;

      feed.prepend(card);
    }

    function sendSimulatedEvent() {
      const username = document.getElementById('simUser').value || 'cristian';
      const comment = document.getElementById('simComment').value || '/girar';

      fetch('/api/simulate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, comment })
      }).then(res => res.json())
        .then(data => console.log('Simulated event response:', data));
    }

    function updateTikTokUsername() {
      const username = document.getElementById('tiktokUsernameInput').value;
      fetch('/api/connect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username })
      }).then(res => res.json())
        .then(data => alert(`Estado: ${data.status.statusText}`));
    }

    connectWebSocket();
  </script>
</body>
</html>
