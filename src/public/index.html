<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo Público — Luke Live Subastas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.3);
      --primary: #6366f1;
      --pink: #ec4899;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.12) 0%, transparent 40%);
      background-attachment: fixed;
    }

    header {
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 1rem 1.5rem;
    }
    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .brand-logo {
      font-size: 1.8rem;
    }
    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.4rem;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 0.4rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #fca5a5;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 8px #ef4444;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    /* Filters Section */
    .filter-bar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.25rem;
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
    }
    .search-box {
      flex: 1 1 280px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .search-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .filter-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .select-custom {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 0.65rem 1rem;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }
    .select-custom option {
      background: #0f172a;
      color: #fff;
    }

    /* Product Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
      position: relative;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(245, 158, 11, 0.4);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
    }

    .card-img-wrap {
      width: 100%;
      height: 220px;
      background: #0f172a;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .card:hover .card-img-wrap img {
      transform: scale(1.05);
    }
    .card-code {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-family: monospace;
      font-weight: 700;
      font-size: 0.8rem;
      color: #fef08a;
    }
    .card-badge {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      background: rgba(99, 102, 241, 0.85);
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }
    .card-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }
    .card-meta {
      display: flex;
      gap: 0.75rem;
      font-size: 0.825rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    .card-meta span {
      background: rgba(255, 255, 255, 0.04);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .card-price {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent);
    }
    .card-price sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .btn-wa {
      background: #25d366;
      color: #000;
      border: none;
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-wa:hover {
      background: #20ba5a;
    }

    /* Modal Details & Carousel */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      padding: 1.5rem;
      overflow-y: auto;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      max-width: 600px;
      width: 100%;
      overflow: hidden;
      position: relative;
      animation: modalIn 0.3s ease-out;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(0,0,0,0.6);
      border: none;
      color: #fff;
      font-size: 1.5rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
    }

    .carousel {
      width: 100%;
      height: 350px;
      background: #000;
      position: relative;
    }
    .carousel img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .carousel-nav {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.5rem;
      z-index: 10;
    }
    .carousel-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      cursor: pointer;
    }
    .carousel-dot.active {
      background: var(--accent);
      width: 24px;
      border-radius: 10px;
    }

    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 1.8rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 12;
      transition: all 0.2s;
    }
    .carousel-arrow:hover {
      background: rgba(245, 158, 11, 0.9);
      color: #000;
    }
    .carousel-arrow.prev { left: 0.8rem; }
    .carousel-arrow.next { right: 0.8rem; }

    .carousel-thumbs {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .carousel-thumb {
      width: 54px;
      height: 54px;
      border-radius: 8px;
      object-fit: cover;
      cursor: pointer;
      opacity: 0.5;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .carousel-thumb.active {
      opacity: 1;
      border-color: #f59e0b;
    }

    .modal-body {
      padding: 1.5rem;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
    .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="brand">
        <div class="brand-logo">👗</div>
        <div>
          <div class="brand-title">Luke Live Subastas</div>
          <div class="brand-sub">Catálogo Oficial de Inventario</div>
        </div>
      </div>
      <div class="live-badge">
        <div class="live-dot"></div>
        <span>LIVE EN TIKTOK @pao.luke</span>
      </div>
    </div>
  </header>

  <main>
    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Buscar por código, personaje, película o nombre..." />
      </div>
      <div class="filter-group">
        <select id="typeFilter" class="select-custom">
          <option value="">Todos los tipos</option>
          <option value="disfraz">Disfraz</option>
          <option value="accesorio">Accesorio</option>
          <option value="prenda">Prenda</option>
        </select>
        <select id="sizeFilter" class="select-custom">
          <option value="">Todas las tallas</option>
          <option value="S">Talla S</option>
          <option value="M">Talla M</option>
          <option value="L">Talla L</option>
          <option value="4-6 años">4-6 años</option>
          <option value="6-8 años">6-8 años</option>
          <option value="8-10 años">8-10 años</option>
        </select>
      </div>
    </div>

    <!-- Catalog Grid -->
    <div class="grid" id="catalogGrid">
      <div class="empty-state">
        <div class="empty-icon">📦</div>
        <h3>Cargando catálogo...</h3>
      </div>
    </div>
  </main>

  <!-- Modal Details -->
  <div class="modal" id="productModal">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="carousel" id="carousel" onclick="nextCarousel(event)">
        <button class="carousel-arrow prev" onclick="prevCarousel(event)">‹</button>
        <button class="carousel-arrow next" onclick="nextCarousel(event)">›</button>
        <img id="carouselImg" src="" alt="Producto" />
        <div class="carousel-nav" id="carouselNav"></div>
      </div>
      <div class="carousel-thumbs" id="carouselThumbs"></div>
      <div class="modal-body">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:0.5rem;">
          <h2 id="modalTitle" style="font-family:'Outfit'; font-size:1.4rem;"></h2>
          <span id="modalCode" style="font-family:monospace; background:rgba(245,158,11,0.2); color:#fef08a; padding:0.2rem 0.6rem; border-radius:6px; font-weight:700;"></span>
        </div>
        <p id="modalDesc" style="color:var(--text-muted); font-size:0.95rem; margin-bottom:1rem;"></p>
        <div style="display:flex; gap:1rem; font-size:0.9rem; color:var(--text-muted); margin-bottom:1.5rem;">
          <span id="modalMeta"></span>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.03); padding:1rem; border-radius:12px;">
          <div>
            <div style="font-size:0.8rem; color:var(--text-muted);">Precio Base Subasta</div>
            <div id="modalPrice" style="font-family:'Outfit'; font-size:1.5rem; font-weight:800; color:var(--accent);"></div>
          </div>
          <a id="modalWaBtn" href="#" target="_blank" class="btn-wa">💬 Consultar por WhatsApp</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentProducts = [];
    let currentImages = [];
    let carouselIdx = 0;

    async function loadCatalog() {
      const search = document.getElementById('searchInput').value.trim();
      const type = document.getElementById('typeFilter').value;
      const size = document.getElementById('sizeFilter').value;

      const params = new URLSearchParams();
      if (search) params.append('search', search);
      if (type) params.append('item_type', type);
      if (size) params.append('size', size);

      try {
        const res = await fetch(`/api/public/catalog?${params.toString()}`);
        const data = await res.json();

        if (data.success) {
          currentProducts = data.products || [];
          renderGrid(currentProducts);
        }
      } catch (err) {
        console.error('Error cargando catálogo:', err);
      }
    }

    function renderGrid(products) {
      const grid = document.getElementById('catalogGrid');

      if (!products || products.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <h3>No se encontraron productos disponibles</h3>
            <p>Intenta cambiar los filtros de búsqueda.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = products.map((p, idx) => {
        const imgs = p.images || p.product_images || [];
        const coverImg = (imgs && imgs.length > 0) 
          ? imgs[0].image_url 
          : 'https://via.placeholder.com/300x300/0f172a/94a3b8?text=Sin+Foto';

        const waText = encodeURIComponent(`¡Hola! Me interesa el artículo #${p.code} (${p.title}) de la tienda en vivo.`);
        const waUrl = `https://wa.me/56912345678?text=${waText}`;

        return `
          <div class="card" onclick="openModal(${idx})">
            <div class="card-img-wrap">
              <span class="card-code">#${p.code}</span>
              <span class="card-badge">${p.item_type}</span>
              <img src="${coverImg}" alt="${p.title}" loading="lazy" />
            </div>
            <div class="card-body">
              <div>
                <div class="card-title">${p.title}</div>
                <div class="card-meta">
                  ${p.size ? `<span>Talla: ${p.size}</span>` : ''}
                  ${p.character ? `<span>${p.character}</span>` : ''}
                </div>
              </div>
              <div class="card-footer">
                <div class="card-price">$${(p.base_price || 0).toLocaleString('es-CL')} <sub>BASE</sub></div>
                <a href="${waUrl}" target="_blank" class="btn-wa" onclick="event.stopPropagation();">💬 Ofertar</a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openModal(index) {
      const p = currentProducts[index];
      if (!p) return;

      document.getElementById('modalTitle').innerText = p.title;
      document.getElementById('modalCode').innerText = `#${p.code}`;
      document.getElementById('modalDesc').innerText = p.description || 'Prenda en excelente estado seleccionada para subasta en vivo.';
      document.getElementById('modalMeta').innerText = [
        p.franchise ? `Franquicia: ${p.franchise}` : '',
        p.size ? `Talla: ${p.size}` : '',
        p.condition ? `Estado: ${p.condition}` : ''
      ].filter(Boolean).join(' • ');

      document.getElementById('modalPrice').innerText = `$${(p.base_price || 0).toLocaleString('es-CL')}`;

      const waText = encodeURIComponent(`¡Hola! Quisiera más información sobre el artículo #${p.code} (${p.title}).`);
      document.getElementById('modalWaBtn').href = `https://wa.me/56912345678?text=${waText}`;

      const imgs = p.images || p.product_images || [];
      currentImages = (imgs && imgs.length > 0)
        ? imgs.map(i => i.image_url)
        : ['https://via.placeholder.com/600x400/0f172a/94a3b8?text=Sin+Foto'];

      carouselIdx = 0;
      updateCarousel();

      document.getElementById('productModal').style.display = 'flex';
    }

    function prevCarousel(e) {
      if (e) e.stopPropagation();
      if (!currentImages || currentImages.length <= 1) return;
      carouselIdx = (carouselIdx - 1 + currentImages.length) % currentImages.length;
      updateCarousel();
    }

    function nextCarousel(e) {
      if (e) e.stopPropagation();
      if (!currentImages || currentImages.length <= 1) return;
      carouselIdx = (carouselIdx + 1) % currentImages.length;
      updateCarousel();
    }

    function updateCarousel() {
      document.getElementById('carouselImg').src = currentImages[carouselIdx];

      const nav = document.getElementById('carouselNav');
      const thumbs = document.getElementById('carouselThumbs');
      const prevBtn = document.querySelector('.carousel-arrow.prev');
      const nextBtn = document.querySelector('.carousel-arrow.next');

      if (currentImages.length > 1) {
        if (prevBtn) prevBtn.style.display = 'flex';
        if (nextBtn) nextBtn.style.display = 'flex';

        nav.innerHTML = currentImages.map((_, i) => `
          <div class="carousel-dot ${i === carouselIdx ? 'active' : ''}" onclick="event.stopPropagation(); setCarousel(${i})"></div>
        `).join('');

        thumbs.style.display = 'flex';
        thumbs.innerHTML = currentImages.map((url, i) => `
          <img src="${url}" class="carousel-thumb ${i === carouselIdx ? 'active' : ''}" onclick="event.stopPropagation(); setCarousel(${i})" alt="Thumb ${i}" />
        `).join('');
      } else {
        if (prevBtn) prevBtn.style.display = 'none';
        if (nextBtn) nextBtn.style.display = 'none';
        nav.innerHTML = '';
        thumbs.style.display = 'none';
      }
    }

    function setCarousel(i) {
      carouselIdx = i;
      updateCarousel();
    }

    // Touch Swipe en Móviles
    let touchStartX = 0;
    const carouselEl = document.getElementById('carousel');
    if (carouselEl) {
      carouselEl.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
      carouselEl.addEventListener('touchend', e => {
        const touchEndX = e.changedTouches[0].screenX;
        if (touchEndX < touchStartX - 40) nextCarousel();
        if (touchEndX > touchStartX + 40) prevCarousel();
      }, { passive: true });
    }

    document.getElementById('modalClose').onclick = () => {
      document.getElementById('productModal').style.display = 'none';
    };

    let searchTimeout;
    document.getElementById('searchInput').addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(loadCatalog, 300);
    });

    document.getElementById('typeFilter').addEventListener('change', loadCatalog);
    document.getElementById('sizeFilter').addEventListener('change', loadCatalog);

    loadCatalog();
  </script>
</body>
</html>
