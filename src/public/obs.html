<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUKE LIVE — OBS GAME SHOW VIEW</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background: transparent !important;
      color: white;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 30px;
    }

    /* Header del Game Show */
    .show-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid rgba(0, 242, 254, 0.3);
      border-radius: 20px;
      padding: 16px 32px;
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .badge-live {
      background: #ff0050;
      color: white;
      font-weight: 900;
      font-size: 14px;
      padding: 6px 14px;
      border-radius: 8px;
      letter-spacing: 1px;
    }

    .show-title {
      font-size: 24px;
      font-weight: 900;
      background: linear-gradient(to right, #ffffff, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .timer-badge {
      background: rgba(255, 0, 80, 0.15);
      border: 2px solid #ff0050;
      color: #ff0050;
      font-size: 20px;
      font-weight: 900;
      padding: 8px 20px;
      border-radius: 99px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Ticker de Leaderboard Permanente */
    .top-leader-ticker {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
    }

    .ticker-pill {
      background: rgba(15, 23, 42, 0.9);
      border: 1.5px solid #1e293b;
      border-radius: 99px;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .ticker-pill.rank-1 { border-color: #feca57; color: #feca57; }
    .ticker-pill.rank-2 { border-color: #e0e0e0; color: #e0e0e0; }
    .ticker-pill.rank-3 { border-color: #ff9f43; color: #ff9f43; }

    /* Área Central Dinámica */
    .center-stage {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin: auto 0;
    }

    /* Tarjeta de Pregunta */
    .question-card {
      width: 100%;
      box-sizing: border-box;
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 20px 24px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
      animation: fadeIn 0.4s ease-out;
      overflow: hidden;
    }

    .question-text {
      font-size: 24px;
      font-weight: 900;
      line-height: 1.35;
      margin: 14px 0 18px 0;
    }

    /* Grilla de 4 Opciones */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      box-sizing: border-box;
    }

    .option-btn {
      background: #0f172a;
      border: 2px solid #1e293b;
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 17px;
      font-weight: 800;
      transition: all 0.3s;
      box-sizing: border-box;
    }

    .opt-letter {
      background: #00f2fe;
      color: #060913;
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 900;
      font-size: 16px;
    }

    .option-btn.correct {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.5);
    }

    .option-btn.correct .opt-letter {
      background: #10b981;
      color: white;
    }

    /* Leaderboard Podium */
    .leaderboard-card {
      width: 100%;
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #8b5cf6;
      border-radius: 24px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .leader-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 20px;
      font-weight: 800;
    }

    .rank-1 { border-color: #feca57; color: #feca57; }
    .rank-2 { border-color: #e0e0e0; color: #e0e0e0; }
    .rank-3 { border-color: #ff9f43; color: #ff9f43; }

    /* Ruleta Inferior Desplegable (Animada) */
    .roulette-wrapper {
      position: absolute;
      bottom: -720px; /* Oculta totalmente fuera de pantalla durante el Quiz */
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: bottom 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
    }

    .roulette-wrapper.active {
      bottom: -320px; /* Desliza suavemente hacia arriba al activarse el giro */
      opacity: 1;
      pointer-events: auto;
    }

    .pointer {
      position: absolute;
      top: -30px;
      z-index: 30;
      width: 0; height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 36px solid #ff0050;
      filter: drop-shadow(0 4px 10px rgba(255, 0, 80, 0.8));
    }

    #wheelCanvas {
      width: 650px;
      height: 650px;
      border-radius: 50%;
      box-shadow: 0 0 50px rgba(0, 242, 254, 0.4);
    }

    .winner-overlay {
      position: absolute;
      top: -100px;
      background: rgba(10, 15, 30, 0.96);
      border: 3px solid #00f2fe;
      border-radius: 20px;
      padding: 14px 32px;
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s;
      z-index: 40;
    }

    .winner-overlay.show {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Optimización Móvil y Pantallas Verticales 9:16 */
    @media (max-width: 600px) {
      body {
        padding: 12px 10px;
      }

      .show-header {
        padding: 10px 14px;
        border-radius: 16px;
        gap: 6px;
      }

      #headerRoundInfo {
        font-size: 11px !important;
        gap: 4px !important;
        flex: 1;
        min-width: 0;
      }

      .timer-badge {
        font-size: 14px;
        padding: 4px 10px;
        border-width: 1.5px;
        flex-shrink: 0;
      }

      .top-leader-ticker {
        gap: 6px;
        margin-top: 6px;
      }

      .ticker-pill {
        padding: 4px 10px;
        font-size: 11px;
      }

      .question-card {
        padding: 16px 14px;
        border-radius: 16px;
      }

      .question-text {
        font-size: 18px;
        margin: 10px 0 14px 0;
      }

      .options-grid {
        gap: 8px;
      }

      .option-btn {
        padding: 10px 10px;
        font-size: 14px;
        gap: 8px;
        border-radius: 10px;
      }

      .opt-letter {
        width: 28px;
        height: 28px;
        min-width: 28px;
        font-size: 14px;
        border-radius: 6px;
      }

      #wheelCanvas {
        width: 360px;
        height: 360px;
      }

      .roulette-wrapper.active {
        bottom: -180px;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="show-header">
    <div id="headerRoundInfo" style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; color: #00f2fe; text-transform: uppercase; flex: 1; min-width: 0; overflow: hidden;">
      <span style="color: #ff0050; white-space: nowrap;">🏷️ TRIVIA GENERAL</span>
      <span style="opacity: 0.4;">•</span>
      <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">🎨 @Cristian Luke</span>
    </div>
    <div class="timer-badge" id="timerBadge">
      ⏱️ <span id="timerVal">20s</span>
    </div>
  </div>

  <!-- Ticker de Podio Permanente (Top 3 Jugadores) -->
  <div class="top-leader-ticker" id="topLeaderTicker">
    <!-- Renderizado dinámico del Podio Top 3 -->
  </div>

  <!-- Stage Principal -->
  <div class="center-stage" id="centerStage">
    <!-- Renderizado dinámico según el estado -->
  </div>

  <!-- Ruleta Inferior -->
  <div class="roulette-wrapper">
    <div class="winner-overlay" id="winnerOverlay">
      <div style="font-size: 22px; font-weight: 900; color: #00f2fe;" id="wUser">@cristian</div>
      <div style="font-size: 26px; font-weight: 900; color: #ff0050;" id="wResult">#14 🐎 Caballo</div>
    </div>
    <div class="pointer"></div>
    <canvas id="wheelCanvas" width="800" height="800"></canvas>
  </div>

  <script>
    // Configuración de colores e íconos de Ruleta de Categorías (36 Segmentos)
    const VIBRANT_COLORS = ['#ff0050', '#00f2fe', '#feca57', '#10ac84', '#9c88ff', '#ff6b6b', '#48dbfb', '#ff9ff3'];
    const CATEGORIES = [
      { id: 1, name: 'Cine y Series', emoji: '🎬' }, { id: 2, name: 'Deportes', emoji: '⚽' }, { id: 3, name: 'Música', emoji: '🎵' },
      { id: 4, name: 'Geografía', emoji: '🌍' }, { id: 5, name: 'Trivia Curiosa', emoji: '🧠' }, { id: 6, name: 'Videojuegos', emoji: '🎮' },
      { id: 7, name: 'Ciencia', emoji: '🚀' }, { id: 8, name: 'Historia', emoji: '📜' }, { id: 9, name: 'Doble Puntaje', emoji: '💥' },
      { id: 10, name: 'Quiz Comunidad', emoji: '🎨' }, { id: 11, name: 'Gastronomía', emoji: '🍕' }, { id: 12, name: 'Relámpago', emoji: '⚡' },
      { id: 13, name: 'Superhéroes', emoji: '🦸' }, { id: 14, name: 'Automovilismo', emoji: '🏎️' }, { id: 15, name: 'Anime & Manga', emoji: '📺' },
      { id: 16, name: 'Naturaleza', emoji: '🦁' }, { id: 17, name: 'Arte & Cultura', emoji: '🎭' }, { id: 18, name: 'Tecnología', emoji: '📱' },
      { id: 19, name: 'Cine y Series', emoji: '🎬' }, { id: 20, name: 'Deportes', emoji: '⚽' }, { id: 21, name: 'Música', emoji: '🎵' },
      { id: 22, name: 'Geografía', emoji: '🌍' }, { id: 23, name: 'Trivia Curiosa', emoji: '🧠' }, { id: 24, name: 'Videojuegos', emoji: '🎮' },
      { id: 25, name: 'Ciencia', emoji: '🚀' }, { id: 26, name: 'Historia', emoji: '📜' }, { id: 27, name: 'Doble Puntaje', emoji: '💥' },
      { id: 28, name: 'Quiz Comunidad', emoji: '🎨' }, { id: 29, name: 'Gastronomía', emoji: '🍕' }, { id: 30, name: 'Relámpago', emoji: '⚡' },
      { id: 31, name: 'Superhéroes', emoji: '🦸' }, { id: 32, name: 'Automovilismo', emoji: '🏎️' }, { id: 33, name: 'Anime & Manga', emoji: '📺' },
      { id: 34, name: 'Naturaleza', emoji: '🦁' }, { id: 35, name: 'Arte & Cultura', emoji: '🎭' }, { id: 36, name: 'Tecnología', emoji: '📱' }
    ];

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const arc = (2 * Math.PI) / 36;
    let currentAngle = 0;

    function drawWheel() {
      const radius = canvas.width / 2;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 36; i++) {
        const angle = currentAngle + i * arc;
        ctx.fillStyle = VIBRANT_COLORS[i % VIBRANT_COLORS.length];
        ctx.beginPath();
        ctx.arc(radius, radius, radius - 10, angle, angle + arc, false);
        ctx.arc(radius, radius, 60, angle + arc, angle, true);
        ctx.fill();

        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(angle + arc / 2);
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 15px Outfit';
        ctx.textAlign = 'right';
        ctx.fillText(`${CATEGORIES[i].emoji} ${CATEGORIES[i].name.toUpperCase()}`, radius - 25, 6);
        ctx.restore();
      }
    }
    drawWheel();

    function renderStage(session) {
      const stage = document.getElementById('centerStage');
      const timerVal = document.getElementById('timerVal');
      const rouletteWrap = document.querySelector('.roulette-wrapper');
      const ticker = document.getElementById('topLeaderTicker');

      timerVal.innerText = session.timeRemaining ? `${session.timeRemaining}s` : '--';

      const headerRoundInfo = document.getElementById('headerRoundInfo');
      const catName = session.currentCategory || (session.current_question && session.current_question.keyword) || 'General';
      const creator = session.creatorHandle || '@Cristian Luke';
      if (headerRoundInfo) {
        headerRoundInfo.innerHTML = `
          <span style="color: #ff0050; white-space: nowrap;">🏷️ ${catName}</span>
          <span style="opacity: 0.4;">•</span>
          <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">🎨 ${creator}</span>
        `;
      }

      // Actualizar Ticker de Podio Permanente (Top 3 Jugadores)
      const lb = session.leaderboard || [];
      if (lb.length > 0) {
        ticker.innerHTML = lb.slice(0, 3).map((p, idx) => `
          <div class="ticker-pill rank-${idx + 1}">
            <span>${idx === 0 ? '🥇' : idx === 1 ? '🥈' : '🥉'} @${p.username}</span>
            <span style="color: #00f2fe;">${p.score} pts</span>
          </div>
        `).join('');
      } else {
        ticker.innerHTML = `<div style="font-size: 13px; color: #9ca3af; font-weight: 700;">🎮 ¡Responde en el chat A, B, C o D para entrar al podio!</div>`;
      }

      if (session.current_state === 'SPINNING') {
        rouletteWrap.classList.add('active');
        stage.innerHTML = ''; // Limpiar tarjetas centrales para dar paso completo a la ruleta
      } else {
        rouletteWrap.classList.remove('active');
        document.getElementById('winnerOverlay').classList.remove('show');
      }

      if (session.current_state === 'SPINNING') {
        // Ruleta activa, escenario central despejado
      } else if (session.current_state === 'WAITING') {
        stage.innerHTML = `
          <div class="question-card">
            <div style="font-size: 20px; font-weight: 800; color: #00f2fe; margin-bottom: 12px;">🎮 LUKE LIVE GAME SHOW</div>
            <div class="question-text">¡PREPÁRATE! La próxima pregunta comienza pronto</div>
            <div style="font-size: 16px; color: #9ca3af;">Responde en el chat escribiendo A, B, C o D</div>
          </div>
        `;
      } else if (session.current_state === 'CATEGORY_INTRO') {
        const brainstorms = {
          'Cine y Series': ['🦸 Marvel & Vengadores', '🚀 Star Wars', '🍿 Animadas & Pixar', '🧙‍♂️ Harry Potter'],
          'Deportes': ['🏆 Mundial de Fútbol', '🏀 NBA Básquetbol', '🏎️ Fórmula 1', '🎾 Tenis de Elite'],
          'Música': ['👑 Rey del Pop', '🎸 Rock Clásico', '💃 Reggaetón', '🎤 K-Pop Mundial'],
          'Geografía': ['📍 Capitales del Mundo', '🏔️ Montañas & Ríos', '🏜️ Maravillas', '🗺️ Banderas'],
          'Videojuegos': ['🍄 Super Mario Bros', '⛏️ Minecraft', '🗡️ Zelda', '🔫 Fortnite'],
          'Ciencia': ['🌌 Espacio', '🧬 Biología', '⚡ Inventos', '🧪 Química'],
          'Quiz Comunidad': ['🐉 Dragon Ball Z', '🍕 Cocina Chilena', '🏎️ Marcas de Autos', '⚽ Copa Mundial']
        };

        const ideas = brainstorms[catName] || ['🌟 Trivia Curiosa', '🔥 Preguntas Clásicas', '💡 Desafío de Nivel', '🎉 Ronda Especial'];

        stage.innerHTML = `
          <div class="question-card" style="border-color: #00f2fe; box-shadow: 0 0 50px rgba(0,242,254,0.3);">
            <div style="font-size: 14px; font-weight: 900; color: #ff0050; letter-spacing: 2px; margin-bottom: 6px;">🎯 LA RULETA ELIGIÓ LA NUEVA CATEGORÍA</div>
            <div class="question-text" style="font-size: 36px; color: #00f2fe; text-transform: uppercase; margin-bottom: 12px;">
              ${catName}
            </div>

            <div style="background: rgba(255, 0, 80, 0.1); border: 2px dashed #ff0050; padding: 14px 18px; border-radius: 16px; margin: 12px 0;">
              <div style="font-size: 13px; font-weight: 900; color: #feca57; text-transform: uppercase; margin-bottom: 8px;">💡 LLUVIA DE TEMAS EN ESTA CATEGORÍA:</div>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 14px; font-weight: 800; color: #ffffff; text-align: left;">
                ${ideas.map(item => `<div style="background: rgba(15,23,42,0.8); padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);">${item}</div>`).join('')}
              </div>
            </div>

            <div style="font-size: 13px; color: #9ca3af; background: rgba(255,255,255,0.05); padding: 6px 16px; border-radius: 99px; display: inline-block;">
              🎨 Preguntas de la comunidad por: <strong>${session.creatorHandle || '@comunidad'}</strong>
            </div>
            <div style="margin-top: 12px; background: linear-gradient(135deg, rgba(255, 0, 80, 0.2), rgba(0, 242, 254, 0.2)); border: 2px solid #00f2fe; padding: 10px 16px; border-radius: 14px; text-align: center;">
              <div style="font-size: 13px; font-weight: 900; color: #feca57; text-transform: uppercase;">🎨 ¡CREA TU PROPIO QUIZ GRATIS CON IA!</div>
              <div style="font-size: 12px; font-weight: 800; color: #ffffff; margin-top: 2px;">
                Entra a <strong style="color: #00f2fe;">quiz.lukeapp.cl</strong> y saldrá en vivo en nuestro próximo directo 🚀
              </div>
            </div>

            <div style="margin-top: 10px; font-weight: 900; color: #10b981; font-size: 16px;">
              ⚡ ¡LA RONDA DE 10 PREGUNTAS COMIENZA AHORA!
            </div>
          </div>
        `;
      } else if (session.current_state === 'QUESTION' || session.current_state === 'RESULT') {
        const q = session.current_question;
        if (!q) {
          stage.innerHTML = `
            <div class="question-card">
              <div style="font-size: 20px; font-weight: 800; color: #00f2fe; margin-bottom: 12px;">🎮 LUKE LIVE GAME SHOW</div>
              <div class="question-text">¡PREPÁRATE! La siguiente pregunta comienza pronto</div>
              <div style="font-size: 16px; color: #9ca3af;">Responde en el chat escribiendo A, B, C o D</div>
            </div>
          `;
          return;
        }

        const isResult = session.current_state === 'RESULT';
        const coverImg = session.coverImage || q.cover_image || q.image_url || null;
        const bgStyle = coverImg 
          ? `background: linear-gradient(rgba(15, 23, 42, 0.88), rgba(15, 23, 42, 0.96)), url('${coverImg}') center/cover no-repeat;`
          : '';

        stage.innerHTML = `
          <div class="question-card" style="${bgStyle}">
            <div class="question-text">${q.text}</div>
            <div class="options-grid">
              <div class="option-btn ${isResult && q.correct_option === 'A' ? 'correct' : ''}">
                <div class="opt-letter">A</div> <span>${q.option_a}</span>
              </div>
              <div class="option-btn ${isResult && q.correct_option === 'B' ? 'correct' : ''}">
                <div class="opt-letter">B</div> <span>${q.option_b}</span>
              </div>
              <div class="option-btn ${isResult && q.correct_option === 'C' ? 'correct' : ''}">
                <div class="opt-letter">C</div> <span>${q.option_c}</span>
              </div>
              <div class="option-btn ${isResult && q.correct_option === 'D' ? 'correct' : ''}">
                <div class="opt-letter">D</div> <span>${q.option_d}</span>
              </div>
            </div>
          </div>
        `;
      } else if (session.current_state === 'LEADERBOARD') {
        const lb = session.leaderboard || [];
        const winnerName = lb.length > 0 ? lb[0].username : 'ganador';
        const isRoundEnd = (session.current_question_index + 1) >= 10 || (session.current_question_index + 1) >= (session.quizQuestionsLength || 10);

        stage.innerHTML = `
          <div class="leaderboard-card">
            <div style="font-size: 22px; font-weight: 900; color: #8b5cf6; text-align: center; margin-bottom: 12px;">🏆 CLASIFICACIÓN DE LA RONDA (${(session.current_question_index || 0) + 1}/10)</div>
            ${lb.slice(0, 3).map((p, idx) => `
              <div class="leader-row rank-${idx + 1}">
                <span>#${idx + 1} @${p.username}</span>
                <span>${p.score} pts</span>
              </div>
            `).join('')}

            ${isRoundEnd ? `
              <div style="margin-top: 14px; background: rgba(255, 0, 80, 0.15); border: 2px solid #ff0050; border-radius: 14px; padding: 12px; text-align: center; font-weight: 900; font-size: 16px; color: #00f2fe;">
                🎉 ¡RONDA COMPLETADA! 🎰 ¡@${winnerName}! ESCRIBE <span style="color: #ff0050;">/girar</span> EN EL CHAT PARA ELEGIR EL TEMA
              </div>
            ` : `
              <div style="margin-top: 12px; background: rgba(0, 242, 254, 0.1); border: 1px solid rgba(0, 242, 254, 0.3); border-radius: 12px; padding: 10px; text-align: center; font-weight: 800; font-size: 13px; color: #9ca3af;">
                ⚡ ¡Prepárate! La siguiente pregunta comienza en breve...
              </div>
            `}

            <div style="margin-top: 12px; background: rgba(255, 0, 80, 0.08); border: 1.5px dashed #ff0050; padding: 10px; border-radius: 12px; text-align: center;">
              <div style="font-size: 12px; font-weight: 900; color: #00f2fe;">🎨 ¿QUIERES VER TU TRIVIA Y TU NOMBRE EN TIKTOK LIVE?</div>
              <div style="font-size: 11px; font-weight: 700; color: #cbd5e1; margin-top: 2px;">
                Crea tu quiz gratis en <strong style="color: #ff0050;">quiz.lukeapp.cl</strong> y saldrá en vivo
              </div>
            </div>
          </div>
        `;
      }
    }

    function spinToResult(targetNumber, username) {
      const rouletteWrap = document.querySelector('.roulette-wrapper');
      rouletteWrap.classList.add('active'); // Desliza la ruleta hacia arriba
      document.getElementById('winnerOverlay').classList.remove('show');

      const targetIndex = targetNumber - 1;
      const targetSegmentAngle = targetIndex * arc + arc / 2;
      const pointerAngle = 3 * Math.PI / 2;
      const finalAngle = (pointerAngle - targetSegmentAngle) + (6 * 2 * Math.PI);
      const startAngle = currentAngle;
      const angleDelta = finalAngle - (startAngle % (2 * Math.PI));
      const duration = 6000;
      const startTime = performance.now();

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        currentAngle = startAngle + angleDelta * easeOut;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          const catItem = CATEGORIES.find(a => a.id === targetNumber) || CATEGORIES[0];
          document.getElementById('wUser').innerText = `@${username}`;
          document.getElementById('wResult').innerText = `#${targetNumber} ${catItem.emoji} ${catItem.name}`;
          document.getElementById('winnerOverlay').classList.add('show');
          confetti({ particleCount: 100, spread: 70, origin: { y: 0.8 } });

          // Ocultar la ruleta suavemente después de 6 segundos de mostrar el premio
          setTimeout(() => {
            rouletteWrap.classList.remove('active');
          }, 6000);
        }
      }
      requestAnimationFrame(animate);
    }

    function connectWS() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${protocol}//${location.host}${location.search}`);

      ws.onmessage = (msg) => {
        try {
          const payload = JSON.parse(msg.data);
          if (payload.type === 'GAME_STATE_UPDATE') {
            renderStage(payload.data);
          } else if (payload.type === 'SPIN_EXECUTED') {
            if (payload.data && payload.data.spinResult) {
              spinToResult(payload.data.spinResult.number, payload.data.username);
            }
          }
        } catch (e) { console.error(e); }
      };

      ws.onclose = () => setTimeout(connectWS, 3000);
    }

    connectWS();
  </script>
