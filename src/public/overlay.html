<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUKE RULETA OVERLAY — TIKTOK LIVE (Visión Inferior)</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    /* Estilos optimizados para resolución vertical móvil (9:16 - TikTok LIVE) */
    body {
      background: transparent;
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }

    .overlay-container {
      position: relative;
      width: 100%;
      height: 45vh; /* Ocupa el 45% inferior de la pantalla vertical móvil */
      display: flex;
      justify-content: center;
      align-items: flex-end;
      overflow: visible;
    }

    /* Aguja / Puntero indicador superior central */
    .pointer {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 24px solid transparent;
      border-right: 24px solid transparent;
      border-top: 42px solid #ff0050;
      z-index: 30;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.9));
    }

    /* Canvas de la ruleta semicircular adaptado a 9:16 */
    #overlayCanvas {
      position: absolute;
      bottom: -45vw; /* Mantiene la rueda encajada en el borde inferior */
      left: 50%;
      transform: translateX(-50%);
      width: 110vw;  /* Ligeramente más ancho que el móvil para formar el abanico perfecto */
      height: 110vw;
      border-radius: 50%;
      filter: drop-shadow(0 -12px 35px rgba(0, 0, 0, 0.85));
    }

    /* Overlay Banner Ganador que aparece flotando sobre el stream */
    .winner-banner {
      position: absolute;
      top: -95px;
      background: rgba(10, 15, 30, 0.96);
      border: 3px solid #00f2fe;
      border-radius: 24px;
      padding: 14px 32px;
      text-align: center;
      box-shadow: 0 12px 45px rgba(0, 242, 254, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      opacity: 0;
      transform: translateY(20px) scale(0.85);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 40;
      backdrop-filter: blur(12px);
    }

    .winner-banner.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .winner-user {
      font-size: 22px;
      font-weight: 900;
      color: #00f2fe;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .winner-result {
      font-size: 26px;
      font-weight: 900;
      color: #ff0050;
    }
  </style>
</head>
<body>

  <div class="overlay-container">
    <div class="winner-banner" id="winnerBanner">
      <div class="winner-user" id="wUser">@cristian</div>
      <div class="winner-result" id="wResult">#14 🐎 Caballo</div>
    </div>

    <div class="pointer"></div>
    <canvas id="overlayCanvas" width="900" height="900"></canvas>
  </div>

  <script>
    // Paleta de colores vibrantes similar al diseño de TikTok
    const VIBRANT_COLORS = [
      '#ff0050', '#00f2fe', '#feca57', '#10ac84', '#9c88ff',
      '#ff6b6b', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd',
      '#ee5253', '#00d2d3', '#ff9f43', '#10ac84', '#2e86de'
    ];

    const CATEGORIES = [
      { id: 1, name: 'Cine y Series', emoji: '🎬' },
      { id: 2, name: 'Deportes', emoji: '⚽' },
      { id: 3, name: 'Música', emoji: '🎵' },
      { id: 4, name: 'Geografía', emoji: '🌍' },
      { id: 5, name: 'Trivia Curiosa', emoji: '🧠' },
      { id: 6, name: 'Videojuegos', emoji: '🎮' },
      { id: 7, name: 'Ciencia', emoji: '🚀' },
      { id: 8, name: 'Historia', emoji: '📜' },
      { id: 9, name: 'Doble Puntaje', emoji: '⭐' },
      { id: 10, name: 'Quiz Comunidad', emoji: '🎨' },
      { id: 11, name: 'Gastronomía', emoji: '🍕' },
      { id: 12, name: 'Relámpago', emoji: '⚡' },
      { id: 13, name: 'Superhéroes', emoji: '🦸' },
      { id: 14, name: 'Automovilismo', emoji: '🏎️' },
      { id: 15, name: 'Anime & Manga', emoji: '📺' },
      { id: 16, name: 'Naturaleza', emoji: '🦁' },
      { id: 17, name: 'Arte & Cultura', emoji: '🎭' },
      { id: 18, name: 'Tecnología', emoji: '📱' },
      { id: 19, name: 'Cine y Series', emoji: '🎬' },
      { id: 20, name: 'Deportes', emoji: '⚽' },
      { id: 21, name: 'Música', emoji: '🎵' },
      { id: 22, name: 'Geografía', emoji: '🌍' },
      { id: 23, name: 'Trivia Curiosa', emoji: '🧠' },
      { id: 24, name: 'Videojuegos', emoji: '🎮' },
      { id: 25, name: 'Ciencia', emoji: '🚀' },
      { id: 26, name: 'Historia', emoji: '📜' },
      { id: 27, name: 'Doble Puntaje', emoji: '⭐' },
      { id: 28, name: 'Quiz Comunidad', emoji: '🎨' },
      { id: 29, name: 'Gastronomía', emoji: '🍕' },
      { id: 30, name: 'Relámpago', emoji: '⚡' },
      { id: 31, name: 'Superhéroes', emoji: '🦸' },
      { id: 32, name: 'Automovilismo', emoji: '🏎️' },
      { id: 33, name: 'Anime & Manga', emoji: '📺' },
      { id: 34, name: 'Naturaleza', emoji: '🦁' },
      { id: 35, name: 'Arte & Cultura', emoji: '🎭' },
      { id: 36, name: 'Tecnología', emoji: '📱' }
    ];

    const canvas = document.getElementById('overlayCanvas');
    const ctx = canvas.getContext('2d');
    const numSegments = 36;
    const arc = (2 * Math.PI) / numSegments;
    let currentAngle = 0;
    let isSpinning = false;

    function drawWheel() {
      const radius = canvas.width / 2;
      const centerX = radius;
      const centerY = radius;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < numSegments; i++) {
        const angle = currentAngle + i * arc;
        const item = CATEGORIES[i];
        const color = VIBRANT_COLORS[i % VIBRANT_COLORS.length];

        // Segmento multicolor vibrante
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius - 10, angle, angle + arc, false);
        ctx.arc(centerX, centerY, 60, angle + arc, angle, true);
        ctx.fill();

        // Borde blanco fino entre segmentos
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.stroke();

        // Texto radial e icono
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle + arc / 2);

        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 4;
        ctx.font = '900 15px Outfit';
        ctx.textAlign = 'right';

        // Emoji cerca del borde, texto orientado hacia el centro
        ctx.fillText(`${item.emoji} ${item.name.toUpperCase()}`, radius - 25, 6);
        ctx.restore();
      }

      // Centro llamativo
      ctx.beginPath();
      ctx.arc(centerX, centerY, 65, 0, 2 * Math.PI);
      ctx.fillStyle = '#1e293b';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 18px Outfit';
      ctx.textAlign = 'center';
      ctx.fillText('LUKE', centerX, centerY - 6);
      ctx.fillStyle = '#ff0050';
      ctx.font = '900 14px Outfit';
      ctx.fillText('LIVE', centerX, centerY + 16);
    }

    drawWheel();

    function spinToResult(targetNumber, username) {
      if (isSpinning) return;
      isSpinning = true;

      document.getElementById('winnerBanner').classList.remove('show');

      const targetSegmentIndex = targetNumber - 1;
      const targetSegmentCenterAngle = targetSegmentIndex * arc + arc / 2;
      const desiredPointerAngle = (3 * Math.PI) / 2;
      const targetCurrentAngle = desiredPointerAngle - targetSegmentCenterAngle;

      const fullSpins = 6 * 2 * Math.PI;
      const startAngle = currentAngle;
      let angleDelta = (targetCurrentAngle - (startAngle % (2 * Math.PI))) + fullSpins;
      if (angleDelta < fullSpins) {
        angleDelta += 2 * Math.PI;
      }

      const duration = 6000;
      const startTime = performance.now();

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        currentAngle = startAngle + angleDelta * easeOut;

        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          showWinner(targetNumber, username);
        }
      }

      requestAnimationFrame(animate);
    }

    function showWinner(targetNumber, username) {
      const cat = CATEGORIES.find(c => c.id === targetNumber) || CATEGORIES[0];
      
      document.getElementById('wUser').innerText = `@${username}`;
      document.getElementById('wResult').innerText = `${cat.emoji} ${cat.name}`;
      document.getElementById('winnerBanner').classList.add('show');

      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.8 }
      });
    }

    function connectWS() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${protocol}//${location.host}`);

      ws.onopen = () => console.log('Overlay WS Connected');

      ws.onmessage = (msg) => {
        try {
          const payload = JSON.parse(msg.data);
          if (payload.type === 'SPIN_EXECUTED') {
            const data = payload.data;
            if (data && data.spinResult) {
              spinToResult(data.spinResult.number, data.username);
            }
          }
        } catch (e) {
          console.error(e);
        }
      };

      ws.onclose = () => setTimeout(connectWS, 3000);
    }

    connectWS();
  </script>
</body>
</html>
